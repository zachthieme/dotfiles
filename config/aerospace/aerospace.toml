# Config schema version. See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Required under config-version 2: version 1 inferred this list from the right
# hand side of the workspace bindings below, which is now an empty default.
# Keep it in sync with the cmd-<n> bindings in [mode.main.binding].
persistent-workspaces = [
  '1_Code',
  '2_Mail',
  '3_IM',
  '4_Teams',
  '5_Web',
  '6',
  '7',
  '8',
  '9',
]

after-login-command = []
after-startup-command = []


# Start AeroSpace at login
start-at-login = true

# Disable mac hiding
automatically-unhide-macos-hidden-apps = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = []

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = [{ monitor."built-in" = 16 }, 15]
outer.right = 10

[mode.main.binding]
# Two rules cover this whole file:
#   1. More modifiers = further out. Bare hjkl moves the cursor (helix),
#      alt-hjkl moves between tmux panes, ctrl-alt-hjkl moves between windows.
#   2. Adding shift moves the thing instead of moving you.
#
# ctrl-alt is the window layer because macOS barely uses it, and neither tmux
# (alt-space prefix, alt-hjkl) nor herdr (ctrl-b prefix) binds it.

# Layout — ctrl-alt + the first letter of what you want.
# Press T or A twice to flip that layout's orientation.
ctrl-alt-t = 'layout tiles horizontal vertical' # Tiles
ctrl-alt-a = 'layout accordion horizontal vertical' # Accordion
ctrl-alt-b = 'balance-sizes' # Balance
ctrl-alt-space = 'layout floating tiling' # float <-> tile

# Reshelve every window onto its assigned workspace (config/fish/functions/darwin/).
# Absolute fish path: the app is launched by launchd, which has no nix profile
# on PATH. /run/current-system/sw/bin is the nix-darwin system profile, so this
# resolves identically on every darwin host regardless of user.
ctrl-alt-0 = 'exec-and-forget /run/current-system/sw/bin/fish -c aero-tidy'

# Summon a chat app's window to the focused workspace (aero-summon wrappers,
# same dir as aero-tidy). M for Microsoft Teams, S for Slack, O for Outlook.
ctrl-alt-m = 'exec-and-forget /run/current-system/sw/bin/fish -c teams-here'
ctrl-alt-s = 'exec-and-forget /run/current-system/sw/bin/fish -c slack-here'
ctrl-alt-o = 'exec-and-forget /run/current-system/sw/bin/fish -c outlook-here'


# Focus — ctrl-alt-hjkl. Was cmd-arrows, which shadowed the universal macOS
# start-of-line / end-of-line / top / bottom of document keys in every text field.
# See: https://nikitabobko.github.io/AeroSpace/commands#focus
ctrl-alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
ctrl-alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
ctrl-alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
ctrl-alt-l = 'focus right --boundaries-action wrap-around-the-workspace'

# Move the window — same keys, plus shift.
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
# Move to a particular workspace
cmd-1 = 'workspace 1_Code'  # terminal
cmd-2 = 'workspace 2_Mail'  # Mail
cmd-3 = 'workspace 3_IM'    # Slack/Messages
cmd-4 = 'workspace 4_Teams' # Teams
cmd-5 = 'workspace 5_Web'   # Web
cmd-6 = 'workspace 6'       # Docs
cmd-7 = 'workspace 7'       # misc
cmd-8 = 'workspace 8'       # misc
cmd-9 = 'workspace 9'       # misc

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
# Move window to a particlar workspace and follow to the workspace
cmd-shift-ctrl-1 = ['move-node-to-workspace 1_Code', 'workspace 1_Code']
cmd-shift-ctrl-2 = ['move-node-to-workspace 2_Mail', 'workspace 2_Mail']
cmd-shift-ctrl-3 = ['move-node-to-workspace 3_IM', 'workspace 3_IM']
cmd-shift-ctrl-4 = ['move-node-to-workspace 4_Teams', 'workspace 4_Teams']
cmd-shift-ctrl-5 = ['move-node-to-workspace 5_Web', 'workspace 5_Web']
cmd-shift-ctrl-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-shift-ctrl-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-shift-ctrl-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-shift-ctrl-9 = ['move-node-to-workspace 9', 'workspace 9']

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
# Move window to a particlar workspace
cmd-shift-1 = ['move-node-to-workspace 1_Code']
cmd-shift-2 = ['move-node-to-workspace 2_Mail']
cmd-shift-3 = ['move-node-to-workspace 3_IM']
cmd-shift-4 = ['move-node-to-workspace 4_Teams']
cmd-shift-5 = ['move-node-to-workspace 5_Web']
cmd-shift-6 = ['move-node-to-workspace 6']
cmd-shift-7 = ['move-node-to-workspace 7']
cmd-shift-8 = ['move-node-to-workspace 8']
cmd-shift-9 = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.pqrs.Karabiner-Elements'
run = "layout floating"

